<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>MNLT Market Smoked Chicken - Register v25</title>
<link rel="stylesheet" href="./styles.css?v=24">
<style>
.sauceLine{font-size:11px;font-weight:900;color:#222;margin-top:5px}.sauceLine span{font-size:9px;color:#1f5d38;margin-left:5px}.sauceButtons{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.sauceButtons button{border:1px solid #d8d0c0;border-radius:6px;background:#eee8dc;color:#222;padding:5px 7px;font-size:9px;font-weight:900}.sauceButtons button.active{background:#1f5d38;color:#fff;border-color:#1f5d38}@media(min-width:701px){.sauceLine{font-size:12px}.sauceButtons button{font-size:10px;padding:6px 8px}}
</style>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#1f5d38">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header>
<h1>MNLT Market — Smoked Chicken</h1>
</header>

<main>
<section class="left">
<div class="card menu">
  <div class="mealGroup">
    <button class="meal" onclick="addPlate()"><span>CHICKEN PLATE</span><b>$7</b></button>
    <button onclick="addExtraItem('chicken')"><span>EXTRA CHICKEN</span><b>+$2</b></button>
    <button onclick="addExtraItem('rice')"><span>DOUBLE RICE</span><b>+$1</b></button>
  </div>
  <div class="alaGroup">
    <div class="menuLabel">À LA CARTE</div>
    <button onclick="addAla('chicken')"><span>CHICKEN</span><b>$4</b></button>
    <button onclick="addAla('rice')"><span>RICE</span><b>$2</b></button>
  </div>
</div>

<div class="card order">
<h2>Current Order <span id="selectedText" style="font-weight:normal;color:#777"></span></h2>
<div id="orderList"></div>
</div>

<div class="card totalCard">
  <div class="total"><span>TOTAL</span><span id="total">$0.00</span></div>
</div>

<div class="card checkoutCard">
  <div class="keyrow">
    <button class="keymini" onclick="key('7')">7</button>
    <button class="keymini" onclick="key('8')">8</button>
    <button class="keymini" onclick="key('9')">9</button>
    <button class="keymini" onclick="key('4')">4</button>
    <button class="keymini" onclick="key('5')">5</button>
    <button class="keymini" onclick="key('6')">6</button>
    <button class="keymini" onclick="key('1')">1</button>
    <button class="keymini" onclick="key('2')">2</button>
    <button class="keymini" onclick="key('3')">3</button>
    <button class="keymini" onclick="key('0')">0</button>
    <button class="keymini clr" onclick="key('C')">C</button>
    <button class="keymini" onclick="key('B')">⌫</button>
  </div>
  <div id="mainCashDisplay" class="cashline">$0.00 Received</div>
  <div id="mainChangeDisplay" class="mainchange">CHANGE: $0.00</div>
  <div class="pay quickPay">
    <button class="quick" onclick="quickCash(5)">$5</button>
    <button class="quick" onclick="quickCash(10)">$10</button>
    <button class="quick" onclick="quickCash(20)">$20</button>
    <button class="take" onclick="completeSale()">CASH OUT</button>
  </div>
</div>
</section>

<section class="right">
<div class="card inventory">
<h2>Live Inventory</h2>
<div class="invgrid">
<div id="chBox" class="box stock"><small>Chicken Thighs</small><b id="chCount">0</b><button onclick="adjust('chicken',1)">+1</button><button onclick="adjust('chicken',12)">+12</button><button onclick="adjust('chicken',-1)">−1</button></div>
<div id="riceBox" class="box stock"><small>Rice Portions</small><b id="riceCount">0</b><button onclick="adjust('rice',1)">+1</button><button onclick="adjust('rice',12)">+12</button><button onclick="adjust('rice',-1)">−1</button></div>
<div class="box"><small>TODAY</small><b id="revenue">$0</b><small id="orders">0 orders</small></div>
</div>
</div>

<div class="card recent">
<h2>Recent Receipts</h2>
<div id="receiptList" class="receiptList"></div>
</div>
</section>
</main>

<div id="cashModal" class="modal"><div class="modalbox">
<h2>Cash Received</h2>
<div id="cashDisplay" class="cashdisplay">$0.00</div>
<div id="changeDisplay" class="change">Change: $0.00</div>
<div class="keypad">
<button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button>
<button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button>
<button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button>
<button onclick="key('0')">0</button><button class="clr" onclick="key('C')">C</button><button onclick="key('.')">.</button>
<button onclick="key('B')">⌫</button><button onclick="closeCash()">CANCEL</button><button class="go" onclick="completeSale()">COMPLETE SALE</button>
</div></div></div>

<div id="receiptModal" class="modal"><div class="modalbox" style="width:min(92vw,390px);max-width:390px;max-height:90vh;padding:10px">
<div id="receiptPaper" class="paper" style="font-size:13px;line-height:1.35;overflow-wrap:anywhere"></div>
<button style="width:100%;padding:12px;margin-top:9px;border:0;border-radius:8px;font-weight:900" onclick="closeReceipt()">CLOSE</button>
</div></div>
<script src="./app.js?v=25"></script>
<div class="versionTag">v25</div>
</body>
</html>
